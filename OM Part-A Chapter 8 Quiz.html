};
function sec(p){return p<172?"8.1":p<211?"8.2":p<253?"8.3":"8.8"}
function ctxr(card,p){const c=CTX[p];if(!c)return;if(c.s)card.append(el("div","ctx",c.s));if(c.r){const d=el("details","ctx");d.append(el("summary","",c.n));const t=el("table");c.r.forEach((r,k)=>{const tr=el("tr");r.forEach(x=>tr.append(el(k?"td":"th","",x)));t.append(tr)});d.append(t);card.append(d)}}
function pick(s){cur=s==="Tümü"?Q:Q.filter(q=>sec(q[0])===s);const ch=document.getElementById("chap");ch.textContent="";["Tümü","8.1","8.2","8.3","8.8"].forEach(x=>{const n=x==="Tümü"?Q.length:Q.filter(q=>sec(q[0])===x).length;const b=el("button","cb"+(x===s?" on":""),(x==="Tümü"?"Tümü":"Chapter "+x)+" ("+n+")");b.onclick=()=>pick(x);ch.append(b)});start(cur)}
function shuf(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function start(arr){list=shuf(arr);i=0;score=0;wrong=[];render()}
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
function render(){
app.textContent="";
if(i>=list.length){return end()}
const q=list[i];done=false;
const m=el("div","meta");m.append(el("span","",`Soru ${i+1} / ${list.length}`),el("span","",`Doğru: ${score}`));
const bar=el("div","bar");const b=el("i");b.style.width=(i/list.length*100)+"%";bar.append(b);
const card=el("div","q");card.append(el("div","pg",`Sayfa ${q[0]}`),el("h2","",q[1]));ctxr(card,q[0]);
const res=el("div","res");const nx=el("button","nx",i+1<list.length?"Sonraki soru":"Sonucu gör");nx.hidden=true;
nx.onclick=()=>{i++;render()};
q[2].forEach((t,k)=>{
const o=el("button","opt",String.fromCharCode(65+k)+") "+t);
o.onclick=()=>{
if(done)return;done=true;
const all=card.querySelectorAll(".opt");
all[q[3]].classList.add("ok");
if(k===q[3]){score++;res.textContent="Doğru."}
else{o.classList.add("bad");wrong.push(q);res.textContent="Yanlış. Doğru cevap: "+String.fromCharCode(65+q[3])+") "+q[2][q[3]]}
nx.hidden=false;nx.focus();
};
card.append(o)});
card.append(res,nx);app.append(m,bar,card);
}
function end(){
const c=el("div","q");
c.append(el("h2","",`Sonuç: ${score} / ${list.length}`));
if(wrong.length){
c.append(el("div","res","Yanlış yaptıkların:"));
wrong.forEach(q=>{const w=el("div","w");w.append(document.createTextNode(`(S${q[0]}) ${q[1]} → `));w.append(el("b","",q[2][q[3]]));c.append(w)});
const r=el("button","nx","Yanlışları tekrar çöz");r.onclick=()=>start(wrong);c.append(r);
}else c.append(el("div","res","Hepsi doğru."));
const a=el("button","nx","Baştan başla");a.style.marginLeft="8px";a.onclick=()=>start(cur);c.append(a);
app.append(c);
}
pick("Tümü");
</script>
