"1-6":[["1 · Organizasyon ve Sorumluluklar", ["Commander yetkisini Chief Flight Operations Officer'dan alır; uçağa bindiğinden inene kadar yolcu, mürettebat ve kargodan sorumludur.", "Acilde güvenlik için kurallardan sapabilir.", "Co-pilot, Commander'ın yardımcısıdır; incapacitation'da komutayı devralır.", "Cabin Chief her ticari yolcu uçuşu için atanır.", "Dispatcher: gerekli veri/dokümanı sağlar, uçuşu izler, yakıt miktarını teyit eder."]], ["2 · Operasyonel Kontrol", ["Yetki: Cancellation ve consolidation = IOCC; continuation ve termination = Commander; delay = Commander/İstasyon Müdürü/IOCC; diversion = Commander veya IOCC.", "Erken kalkış (11 dk) IOCC onayı ister; 15 dk üzeri yer gecikmeleri IOCC'ye bildirilir.", "OFP (yakıt verisi) 4 yıl, post-flight zarfı EFB'de 3 ay saklanır."]], ["3 · SMS / Raporlama", ["SRS üzerinden ASR, CFR, FGR, HAZ vb. raporlar verilir."]], ["4 · Mürettebat Kompozisyonu", ["Uçuş içi pilot değişimi yalnızca FL200 üzerinde; dinlenme sonrası PF briefing verir.", "Ortak dil: Türkçe ve/veya İngilizce; Türk olmayan mürettebatla İngilizce.", "Commander incapacitation'da: en kıdemli operating Commander → non-operating tip kalifiyeli Commander → …"]], ["5 · Yeterlilikler", ["Geçerli lisans + tip rating + min. ICAO Level 4 + Class 1 medikal.", "Havaalanı kategorileri A/B/C; Cat C'de min. C1 Commander PF olmalı; yeterlilik 12 ay geçerli.", "Recent experience: önceki 90 günde aynı tipte en az 3 kalkış-yaklaşma-iniş (PF); 120 güne uzatılabilir.", "Cat II/III için min. 2 FSTD yaklaşması."]], ["6 · Mürettebat Sağlığı", ["Alkol: görev/standby sırasında yasak; raporlamadan en az 12 saat önce bırakılır (24 saat tavsiye).", "Kan bağışı sonrası 24 saat görev yok; no-deco scuba sonrası 24 saat, deko dalışta 24-48 saat."]], ["8.1 · Yakıt, Minima ve Pist Detayları", ["Kalkış yakıtı: Taxi+APU, Trip, Contingency, Alternate, Final Reserve, Additional, Extra. Nihai karar Commander'ındır.", "Contingency: tüketim sapması, meteoroloji, rota/seviye değişimi ve uzun taksi için taşınır.", "Destinasyon alternatifi: en az 1; hava/minima/rüzgar sağlanamıyorsa veya MET yoksa 2. Alternatifsiz uçuş: izole alan veya (≤6 saat, replan ≤4 saat, 2 ayrı pist + ayrı yaklaşma).", "Son 12 ayda o alana uçmamış Commander için MDA/MDH'e +50 ft ve görüşe +100 m eklenir.", "Kalkış: hava, iniş minimumuna eşit/iyi olmalı; değilse hava şartlarına uygun take-off alternate gerekir.", "Çapraz rüzgar (PF Co-pilot): P5/P6 15 kt, P3/P4 20 kt (hamle dahil); B777/B787/A330/A350 kuru pistte Commander takdiriyle 35 kt'a kadar.", "Kısa ve dar pistte sol koltukta kalifiye Commander; incapacitation'da sağ koltuk kalifiye Commander değilse go-around.", "Düşük sıcaklık düzeltmesi OAT ≤ 0°C'de QNH irtifasına eklenir; QNH kullanımında düşük basınç düzeltmesi gerekmez.", "Steep approach: FAF sonrası tam stabilize ve iniş konfigürasyonunda."]]],
"8.1":[["s.96–97 · OFP ve Minimum Uçuş İrtifaları",["Her uçuş için OFP; uçak performansı, işletme limitleri, rota boyunca beklenen şartlar ve ilgili havaalanları dikkate alınarak hazırlanır.","Minimum uçuş irtifalarını THY belirler ve yayınlar.","RNAV/RNP prosedürlerinde arazi ve engel ayrımından Commander sorumludur.","Minimum irtifada veya altında “DIRECT TO” / “PROCEED OWN NAVIGATION TO” radar vektörü sayılmaz; arazi ayrımı Commander'dadır."]],["s.99–102 · Arazi/Engel Ayrımı ve İrtifa Düzeltmeleri",["Kalkışta arazi ayrımı için: RTOW hesabı, EOSID ve tırmanış/alçalış minimum irtifalarına uyulur. Kalkıştan sonra 400 ft AGL'ye kadar dönüş yapılmaz.","Düşük sıcaklık düzeltmesi: OAT 0 °C veya altındaysa tablo değerleri QNH irtifasına eklenir; MSA, MDA, DA, missed approach, thrust reduction, acceleration, engine-out acceleration ve holding irtifalarının hepsine uygulanır.","Düşük basınç düzeltmesi QNH ile gerekmez; QNE kullanılıyorsa, radar vektörü yoksa ve yayınlanan QNH standardın (1013 hPa) altındaysa minimum emniyet irtifaları düzeltilir.","Güçlü rüzgâr + dağlık arazi (Bernoulli etkisi): düzeltme gerekip gerekmediğine Commander karar verir; rüzgâr düzeltmesi basınç ve sıcaklık düzeltmesine ek uygulanır, ATC'ye bildirilir. ATC klerensi rüzgâr ve arazi etkisini kapsamaz."]],["s.103–104 · Havaalanı Yeterliliği",["LS.74.040 Aerodrome Categorisation List'teki havaalanları yeterli ve kullanım için yetkilidir.","Listede olmayan havaalanı, Commander uçuş emniyeti için gerekli görürse; pist uzunluğu/genişliği, PCN, ATC hizmeti gibi uygunluk tüm kaynaklarla doğrulandıktan sonra kullanılabilir (ACARS, HF, VHF ile hava ve NOTAM alınabilir).","Yeterli havaalanı: kullanım zamanında açık; ATS, yeterli aydınlatma, haberleşme, hava raporlama, seyrüsefer yardımcıları ve acil durum hizmetlerine sahip."]],["s.105–106 · Hava Güvenlik Marjları",["Kalkış alternatifi ve varış için ETA −1/+1 saat penceresinde hava, iniş minimumunda veya üstünde olmalı (RVR/VIS; Type A veya circling için tavan MDH veya üstü).","ERA için de aynı pencere geçerli.","THY politikası: Azerbaycan, Belarus, Gürcistan, Kazakistan, Kırgızistan, Moldova, Çin, Rusya, Tacikistan, Türkmenistan, Ukrayna ve Özbekistan havaalanlarında, minimumun altını gösteren TEMPO, PROB 30/40 (tek başına) veya PROB 30/40 TEMPO tahminleri olsa da uçuş dispatch edilebilir; uçuş Dispatch Manual 2.3'e göre izlenir."]],["s.108–109 · Kalkış Alternatifi",["Kalkış alanı kullanılabiliyorsa kalkış alternatifi gerekmez; kalkış alanı OFP'de kalkış alternatifi olarak seçilmez.","Kalkış alanı hava, performans veya başka nedenle kullanılamıyorsa uygun bir kalkış alternatifi OFP'de belirtilir.","Mesafe: ETOPS onayı yoksa gerçek kalkış kütlesiyle, ISA ve durgun havada tek motor arızalı (OEI) seyir hızında en fazla 1 saat; ETOPS'ta onaylı diversion süresi.","AFM'de OEI seyir hızı yoksa kalan motor(lar) maksimum sürekli güçte iken ulaşılan hız kullanılır.","Gerekçe: kalkıştan sonra anormal/acil durumda güvenli iniş. Alternatif şu durumlarda seçilir: kalkış alanı havası THY iniş minimumunun altındaysa veya başka nedenle geri dönüş imkânsızsa."]],["s.110–112 · Varış Alternatifi ve İzole Havaalanı",["Her IFR uçuşta OFP ve ATS planında en az 1 varış alternatifi; hava marjı, iniş minimaları veya rüzgâr bileşeni limitleri sağlanamıyorsa ya da MET yoksa 2 alternatif.","Alternatifsiz uçuş: izole havaalanı veya (uçuş ≤ 6 saat, replan ≤ 4 saat) + iki ayrı kullanılabilir pist (ayrı iniş yüzeyi, her birinin ayrı seyrüsefer yardımcılı yaklaşması) + uygun hava tahmini.","İzole havaalanı: alternate yakıtı + FRF, varış üzerinde FRF dahil 2 saatlik normal seyir yakıtından fazlaysa (bu 2 saat 30 dk FRF + yaklaşık 90 dk hold bırakır). İzole planlamada bir PNR (point of no return) bilgisayarlı planlama sistemiyle belirlenip OFP'ye yazılır."]],["s.113 · Planlama Minimaları – Tablo 3 (LVO onaysız yeni tip)","t113"],["s.114 · Planlama Minimaları – Tablo 4 (günlük operasyon)","t114"],["s.115–117 · Curfew ve Taksiyol Limitleri",["Curfew saatleri OM Part-C / Jeppesen'de yayınlıdır. Uçuşun curfew saatlerinde başlamamasından Dispatch sorumludur.","Uçuş başladıktan sonra öngörülemeyen durumda IOCC havaalanı otoritesinden izin alır; Commander, curfew'lu havaalanı için revize ETA'yı IOCC'ye bildirir. IOCC'ye ulaşılamazsa uçuş plana göre devam eder (aksi söylenmedikçe).","Kullanılacak taksiyollar, kanat açıklığı veya ana iniş takımı dış tekerlek açıklığından hangisi daha zorlayıcı kod harfi veriyorsa ona göre seçilir; genişlik veya kanat ucu ayrımı şüpheliyse ATC ile teyit önerilir."]],["s.118–121 · Dar, Kısa Pist ve Arresting Gear",["Dar pist (30 m ve üzeri, 40 m'ye kadar) ve kısa pist (TORA ve LDA < 6.500 ft / 1.982 m) için özel mürettebat sertifikası gerekir.","Zorunlu çalışır sistemler: uçuş kumandaları, tüm teker frenleri, nose wheel steering, anti-skid, tüm reverserlar; kısa pistte ayrıca auto-brake.","Kısa ve dar pistte kalkış/iniş yalnızca uygun kalifiye, sol koltuktaki Commander tarafından yapılır; Commander incapacitation'da sağ koltuktaki pilot (kalifiye Commander değilse) go-around başlatır. Kalkış alternatifi OFP'de belirtilir.","Arresting gear/hook barrier: iniş type kalifiye Captain tarafından sol koltuktan; LDA, eşikten kabloya olan mesafe kadar azaltılır; performans ayarlanmış LDA'ya göre hesaplanır; teker koyma kablonun ötesine planlanır; autoland yapılmaz."]],["s.123–124 · Gece Operasyonları",["İniş pisti için: eşik ışıkları, pist kenar ışıkları, pist sonu ışıkları (eşik ışıkları yerine geçebilir) ve VASI/PAPI (veya ILS glideslope / LNAV/VNAV glidepath); doğrudan yaklaşma (straight-in) minimumu olan prosedür gerekir. Circle-to-land gece yasaktır; side-step veya özel onaylı görsel yaklaşma izin verilebilir.","Kalkış pisti için: pist kenar ışıkları, pist sonu ışıkları (eşik ışıkları yerine geçebilir) ve yayınlı SID (yoksa yayınlı EOSID; EOSID kullanılacaksa ATC'ye bildirilir)."]],["s.98 · Minimum İrtifalar",["MEA: iki radyo noktası arasında yayınlanan en düşük irtifa (seyrüsefer sinyali + engel ayrımı).","MGA: rotadan sapıldığında uçulabilecek en düşük güvenli irtifa.","MSA: seyrüsefer istasyonu/havaalanı referans noktası çevresindeki güvenli irtifa; devlet otoritesi yayınlar.","MTCA: ATS rotaları, STAR'lar (IAF'ye kadar) ve bazı SID bölümlerinde arazi/engel ayrımı irtifası."]],["s.105–111 · Havaalanı Seçimi ve Alternatifler",["Kalkış alternatifi ve varış için hava, ETA −1 / +1 saat penceresinde iniş minimumunun üstünde olmalı; ERA için de aynı pencere.","Her IFR uçuşta en az 1 varış alternatifi; hava/minima/rüzgar sağlanamıyorsa veya MET yoksa 2 alternatif.","Alternatifsiz uçuş: izole alan veya (uçuş ≤6 saat, replan ≤4 saat, 2 ayrı pist ve ayrı seyrüsefer yardımcılı yaklaşma, uygun hava)."]],["s.122 · Steep Approach",["Nominal açı: CAT I için 3,5°, CAT II/III için 3,0°; NPA'da %6,1 (~3,5°).","EASA'ya göre 4,5° altı steep sayılmaz. Steep yaklaşmalar FAF sonrası tam stabilize ve iniş konfigürasyonunda uçulur."]],["s.150–153 · Yakıt Politikası",["Commander, planlanan kullanılabilir yakıt ve yağın bulunduğundan emin olmadan başlamaz/devam etmez; nihai yakıt kararı Commander'ındır.","Kalkış yakıtı: Taxi+APU, Trip, Contingency, Alternate, Final Reserve, Additional, Extra.","İki alternatif gerekiyorsa daha fazla yakıt gerektiren alternatif esas alınır.","Contingency: tüketim sapması, hava tahmin sapması, rota/seviye değişimi ve uzun taksi için."]],["s.126–128 · Rüzgar ve Touchdown",["Yan rüzgar (PF Co-pilot): P5/P6 için 15 kt, P3/P4 için 20 kt (hamle dahil).","B777/B787/A330/A350 kuru pistte, AFM/FCOM onaylıysa, Commander takdiriyle 35 kt'a kadar.","İniş hedefi: eşik/aiming point sonrası ilk 300 m (1.000 ft).","900 m (3.000 ft) veya LDA'nın 1/3'ü (hangisi küçükse) içinde teker koymazsa go-around."]],["s.127 · RCAM","rcam"],["s.129–130 · Minima Kavramı",["Üç tür minima: uçak yeteneği (AFM), havaalanı işletme minimaları (Jeppesen/ulusal otorite), THY minimaları.","THY minimaları, yukarıdakilerden düşük olamaz.","Minimalar her kalkış, varış ve alternatif için belirlenir; arazi/engel ayrımı ve görsel referans kaybı riskini azaltır."]],["s.131 · Uçak Kategorileri","cat"],["s.132–133 · Mürettebat ve Kalkış Minimaları",["Mürettebat minimaları: iki pilottan yüksek olan geçerlidir.","Commander son 12 ayda o alana uçmadıysa MDA/MDH +50 ft, görüş +100 m. Yalnızca glidepath vermeyen yaklaşmalarda (LOC, VOR, NDB, LNAV) ve Aerodrome Information Note yoksa uygulanır.","Kalkış minimaları VIS veya RVR ile verilir; hava, iniş minimumunun altındaysa uygun take-off alternate gerekir."]]],
"8.2":[["s.173–176 · Yakıt Türleri ve Karışım",["Standart yakıt Jet A-1; 1. ikame Jet A, 2. ikame JP-8, 3. ikame TS-1, RT, JP-5.","Parlama noktası / maks. donma noktası: Jet A-1 38 °C / −47 °C; Jet A 38 / −40; JP-8 38 / −47; JP-5 60 / −46; TS-1 28 / −50; Jet-B (wide-cut) −51.","Bazı pazarlarda Jet A-1 kısıtlı olabilir: NOTAM/Airport Directory ve yakıt makbuzundaki cinse bakılır.","Karışım: en yüksek donma noktalı yakıt %10'dan fazlaysa karışımın limit donma noktası esas alınır. %10'dan az Jet A + %90'dan fazla Jet A-1 → Jet A-1 (~−47 °C); %10'dan fazla Jet A → Jet A (~−40 °C); şüphede en muhafazakâr değer.","En iyi seyreltme için az miktardaki Jet A, ikmalden önce iç kanat tanklarına aktarılır.","Jet A ile Jet A-1 karışırsa yakıt Jet A sayılır (örnek St. Petersburg: Jet A ikmali → −40 °C; TS-1 ikmali → −47 °C). Kuzey rotaları gibi donma payı düşük rotalarda AFM/FCOM limitleri ile makbuzdaki cins karşılaştırılır."]],["s.177–181 · İkmal Kuralları (tek motor dahil)",["GPU/APU çalışıyorsa uçak enerjili olabilir ama GPU/APU ikmal sırasında başlatılıp durdurulmaz.","Havaalanı yakınında fırtına varsa ikmal derhal kesilir, araç bağlantısı çıkarılır ve uçaktan güvenli mesafeye alınır.","Tek motor çalışırken ikmalde: yalnızca mürettebat uçakta, yolcu yok; havaalanı kurtarma/yangın servisi başından sonuna uçağın yanında; pilotlar sürekli kokpitte; prosedür FCOM/MEL'de tanımlı olmalı."]],["s.182 · Wide-Cut Yakıt",["Kullanım SVP Flight Operations onayına tabi; Boeing B737'de wide-cut'a izin vermez.","Yolcu uçakta/biniyor/iniyorken wide-cut ikmali yapılmaz.","İkmalden önce uçak elektriği OFF yapılır, hortumlar sökülene kadar OFF kalır; over-wing ikmal yapılmaz; dolum hızı düşürülür.","Teknik log'a yazılır; sonraki iki ikmal (wide-cut olmasa da) wide-cut sayılır."]],["s.183–184 · Yolcu Varken İkmal",["Yalnızca Commander izniyle başlar; Commander kokpitte kalır; gerekli minimum kabin ekibi uçakta bulunur.","Yer faaliyetleri (catering, temizlik) acil tahliyeyi engellemez; yangın araçları uçağın yanında konumlanır; ikmali denetleyen yer ekibiyle iki yönlü haberleşme kurulu kalır.","Biniş kapısı dışındaki kapılar kapalı tutulur (slide'lar disarm) veya açık kapıya merdiven konur.","Commander ikmal öncesi Cabin Chief ve yer temsilcisini bilgilendirir: rapid deplaning/tahliye kapıları, yolların açık ve rampanın temiz olması, ikmal süresi ve alternatif haberleşme.","“Fasten Seat Belt” OFF, “No Smoking” ON, emergency lighting ARM."]],["s.187–188 · Tek Motor Çalışırken Biniş ve Transit",["Tek motor çalışırken biniş/iniş Commander onayıyla yapılabilir. Köprüde yer personeli rampaya erişimi engeller. Merdivenle yalnızca çalışan motorun karşı tarafındaki kapılardan; yer personeli merdiven dibinde, orta noktada ve otobüs/terminal girişinde bulunur.","Transit duruşta inen yolcular kabin eşyalarını alır, transit yolcular uçakta kalır; kabin ekibi güvenlik araması yapar. Bulgu yoksa biniş sürer; bulgu varsa şüpheli eşya yerinden oynatılmaz, yerel otorite güvenlik prosedürü uygulanır."]],["s.189–192 · Yolcu Sayımı ve Manifesto",["Kapı kapanmadan önce kapıdan geçen yolcu sayısı uçaktaki sayıya eşit olmalıdır.","Sayım: uzak park yerinde; kapı/köprüde Line Information Form (FR.71.0216) istiyorsa; Commander, Cabin Chief veya yer personeli load sheet ile uyuşmazlıktan güçlü şüphe duyarsa.","Uçmaktan vazgeçen veya yanlış uçağa binen yolcu: Commander operasyon koordinatörü/yolcu hizmetleri/istasyon yetkilileri dışında otoriteye bildirmek zorunda değildir. Yolcu uçakta ısrar ederse kalanlar kabin eşyalarını kucaklarında kontrol eder, kabin ekibi detaylı güvenlik araması yapar; transit/diversion sonrası ise yolcunun bagajı kargodan indirilir (diversion'da checked bagaj indirilemeyebilir).","Manifesto: uluslararası kalkışta Cabin Chief isterse bilgisayar çıktısı; teknik sorunda elle yazılmış liste; hiç sağlanamazsa istasyon temsilcisinin gerekçeli, imzalı ve telefonlu yazılı beyanı."]],["s.193–198 · Rapid Deplaning ve Özel Yolcular",["RD: acil tahliye dışı, ciddi tehlike olup kontrollü inişe zaman olan durumlar; köprü/merdiven bağlı ve yolcu içerideyken her an başlatılabilir. Örnekler: yakıt sızıntısı, kabine duman/koku, yer ekipmanı kaynaklı yakın yangın, yakın kaza. Yolculara talimat açık olmalı (RD ile tahliye farkı).","Özel yolcular (SCP): kendine bakamayan/acil prosedürleri yapamayan yolcu için nitelikli refakatçi şart; Commander önceden bilgilendirilir; acil durumda diğer yolcularla aynı yardım verilir; hasta, hamile ve PRM kabulü yer hizmetlerine, nihai karar istasyon müdürüne aittir.","Infant <2 yaş (loop belt; infant sayısı infant can yeleği sayısını aşmaz). Minor 2–<12; Accompanied Minor 2–<7 (refakatçiyle); Minor Group 7–<12 gruplar; Unaccompanied Minor 7–<12 refakatçisiz.","INAD/deportee/gözaltı: sözlü veya fiziksel direnirse biniş reddedilir. Kelepçe/bukağı/ağız bandı normalde kabul edilmez; çok özel durumda Commander onayı şart."]],["s.199–202 · Yer Ekipmanı, Kapılar, Start-Up",["Beacon ON: motorlar çalışacak/çalışıyor/çekiliyor/uçak hareket ediyor, personel uzak durur; OFF: yaklaşmak güvenli. Nose wheel takozu/GPU bağlayacak kalifiye personel hariç beacon OFF olmadan yaklaşılmaz; kırmızı çizgili alana ekipman girmez.","Kapı limitleri FCOM'da; rüzgâr limit üstündeyse Commander Cabin Chief ve yer ekibini uyarır. Varışta beacon OFF olmadan kapı açılmaz; kabin kapıları Commander izniyle açılır (bir izin, preflight/turn-around için yeterli). Kapıları kabin ekibi/kalifiye teknisyen, yoksa pilotlar açar.","Motor start: yükleme bitmiş, kapılar kapalı, GPU hariç yer ekipmanı uzaklaştırılmış. Dar/kalabalık apronda marshaller yardımı. Kalkış öncesi el işaretine izin gelene kadar kokpit-yer intercom'u kullanılır.","Yalnızca ICAO Annex 2/Jeppesen/GOM el işaretleri; headset arızası veya şiddetli CB varsa Commander mutabakatıyla işaret dili; yetersiz aydınlatma, kötü görüş, gece veya yerel kural varsa ışıklı çubuk/torch."]],["s.203–210 · Dokümanlar, Özel Yükler ve Biniş Reddi",["Uçakta bulunacak dokümanlar: Mass & Balance, SCP bildirimi, Special Loads Notification, Dangerous Goods Notification ve Transport Document, General Declaration, Pax/Cargo Manifest, Air Mail.","Canlı hayvan (AVI) kabulü yer hizmetlerine devredilmiştir, nihai karar istasyon müdüründe.","PER kargo: Commander Special Loads Notification ile bilgilendirilir; soğutma/ısıtma kısıtı yok (72 saat dayanıklı); Commander emin değilse reddedebilir, yetkili personel onaylarsa not düşülür.","LHO (canlı organ/kan plazması): kabinde, mürettebat gözetiminde, ana kapıya yakın; canlı hayvandan ayrı yüklenir; NOTOC ile bildirilir; pilotlar kalkış/iniş/direkt rota önceliği isteyebilir.","AOG parçaları yalnızca kargo bölümünde (kokpit/kabinde değil); hidrolik sıvı, yağ, teker gibi arıza gidermede kullanılan malzemeler AOG sayılmaz; yüklenen parça Weight & Balance Sheet'e yazılır; tehlikeli madde ise IATA DGR'ye göre işlenir.","Biniş reddi: Commander, sarhoş, alkol/uyuşturucu etkisindeki veya hastalığı diğer yolcuları riske atanlara (bakım altındaki hasta hariç) biniş izni vermeyebilir. Zorluk halinde havaalanı veya yerel polisten yardım istenir."]],["s.177–181 · Yakıt İkmali",["Yalnızca kalifiye personel yapar/denetler; park freni veya takoz uygulanır.","Hortum bağlanmadan önce araç ve uçak bonding edilir; araçlar kurtarma/tahliye yollarını kapatmaz.","Tek motor çalışırken ikmal yalnızca GPU yoksa ve APU arızalıysa; prosedür FCOM/MEL'de tanımlı olmalı."]],["s.189–198 · Yolcu İşlemleri",["Kapı kapanmadan önce kapıdan geçen yolcu sayısı uçaktaki sayıyla eşit olmalı; uzak park yerinde sayım zorunlu.","Rapid deplaning: acil tahliye gerektirmeyen ama kontrollü inişin mümkün olduğu tehlikeler (yakıt sızıntısı, duman, yakın yangın).","Infant: <2 yaş (loop belt; infant sayısı infant can yeleği sayısını aşmaz). Minor: 2–<12 yaş.","Sınır dışı edilecek/şüpheli yolcu: sözlü veya fiziksel direnirse biniş reddedilir."]],["s.199–205 · Yer Ekipmanı ve Dokümanlar",["Beacon ON: motor çalışacak/çalışıyor/çekiliyor; yer personeli uzak durur.","Motor start: yükleme bitmiş, kapılar kapalı, GPU hariç yer ekipmanı çekilmiş.","Yer personeli ve pilotlar yalnızca ICAO Annex 2 el işaretlerini kullanır.","Perishable kargo: Commander Special Loads Notification ile bilgilendirilir."]]],
"8.3":[["s.212–213 · Genel Kurallar ve Görsel Yaklaşma",["Revenue uçuşlarda IMC/anormal durum yapay olarak simüle edilmez (örn. circuit breaker çekmek); yalnızca non-revenue eğitim/test uçuşlarında mümkün. THY kontrolsüz havaalanlarına uçmaz.","Tüm revenue uçuşlar IFR; IFR iptali yapılamaz.","“Own separation in VMC” veya visual approach (gereksiz yakıt/gecikmeyi önlemek için) şartları: trafik görülebilir ve gözde tutulur, ayrım her zaman sağlanır, gündüz, VMC, kesin pozisyon ve arazi ayrımı.","Visual approach: ATC onayı gerekir, IFR uçuşun parçasıdır; PF ve PM havaalanı/pisti görmeli ve tanımalı; görsel referans kaybedilirse go-around (rota ATC ile teyit)."]],["s.214–217 · Gürültü, Navigasyon, CDFA, SLOP",["Gürültü azaltma: NADP 1 (yakın çevre) ve NADP 2 (uzak çevre); ulusal kurallar farklıysa onlar önceliklidir; Commander güvenlik yetkisini kullanabilir.","Navigasyon: birincil yardımcıların çapraz kontrolü; aktif uçuş planı iki pilot tarafından rota ve toplam mesafe açısından kontrol edilir. Manuel uçuşta PF navaid'leri PM'e söyletir; otopilotta PF ayarlar, PM'in değişiklikleri PF tarafından kontrol edilir. ILS mode, huzme civarı bağımsız kaynakla doğrulanmadan arm edilmez.","CDFA: NPA'larda stabilize CDFA; farklı teknik yalnızca DGCA onayıyla ve RVR +400 m artışıyla.","SLOP: yalnızca 3 pozisyon – eksen, 1 NM veya 2 NM sağ. Otomatik offset yoksa eksen. Kullanılmaz: MSA altında, SID/STAR/radar vektöründe, B-RNAV veya RNP5 ve daha iyisi gereken alanda; önceden ATC onayı gerekir."]],["s.218–222 · Altimetre, GPWS, RAAS, CFIT, TCAS",["Referans: STD 1013.2 hPa (FL/QNE) veya QNH (irtifa). Ana altimetrede QFE yasak. Transition Level altında klerens gelince QNH ayarlanır; Transition Level üzerinde alçalma durdurulursa STD'ye dönülür.","GPWS/TAWS kalkıştan inişe ON (MEL hariç). Navigasyon arazi ekranına dayandırılmaz; PM tüm kalkış/varışlarda terrain display kullanır. Uyarıda gecikmeden tırmanış başlatılır; görsel olarak engel aşıldığı doğrulanıncaya veya uygun sektör güvenli irtifasının üzerine çıkılıncaya kadar sürdürülür.","RAAS (varsa): yer operasyonu, kalkış, yaklaşma ve go-around'da kullanılır; doğru taksi rotası ve pist Commander sorumluluğundadır; RAAS navigasyon için değildir, NOTAM/ATIS bilmez, pistin güvenli olup olmadığını garanti etmez.","CFIT: son yaklaşmada MDA(H)/DA(H) öncesi irtifa/mesafe kontrolleri; radyo altimetre 2.500 ft AGL'de devreye girince callout yapılır ve taramaya alınır.","TCAS TA/RA modunda kullanılır (anormal/performans durumu hariç). Kritik alanlarda (havaalanı yakını, yoğun terminal, 10.000 ft altı) dikkat dağıtan işlemler en aza indirilir. Seviyeye son 1.000 ft'te tavsiye edilen düşey hız 1.000 ft/dk'yı geçmez."]],["s.223 · Düşey Hız ve Callout'lar",["PM: atanmış irtifaya 2.000 ft kala “2,000 TO GO”, 1.000 ft kala “1,000 TO GO”.","Fark 2.000 ft'ten azsa V/S mode düşünülür. 2.000 ft kala düşey hız ≤ 1.500 fpm, 1.000 ft kala ≤ 1.000 fpm (ATC, hava sahası, SID/STAR, hava kaçınma gibi özel durumlar hariç)."]],["s.226–233 · Uçuşta Yakıt Yönetimi ve MINIMUM FUEL",["Yakıt kontrolü ≤ 60 dk; kalan ve kullanılan yakıt OFP'ye yazılır; gerçek ile planlı tüketim karşılaştırılır ve varışta beklenen yakıt hesaplanır.","Varışta beklenen yakıt ≥ alternate + FRF (alternatif gerekmiyorsa ≥ FRF). Daha azsa Commander ATC'den gecikme bilgisi ister; varışa gitmek veya FRF'den az olmamak üzere diversion arasında karar verir.","Beklenmedik durumda FRF + (alternatife/izole havaalanına yakıt) altına inme riski varsa ATC veya IOCC'den güvenilir gecikme bilgisi istenir.","MINIMUM FUEL: belirli bir havaalanına inişe taahhüt edildiğinde ve klerans değişikliği planlanan FRF'den az yakıtla inişe yol açabileceği hesaplandığında bildirilir. Acil durum değildir, olası acil durum uyarısıdır; “committed to land” kararı tek başına MINIMUM FUEL gerektirmez. Hava durumu gibi ATC dışı gecikme etkenleri de dikkate alınır.","Taahhüt şartları: EAT/holding/gecikme bilgisi (veya replan'da IOCC bilgisi); FMS güncellemesi; ETA'da hava minimum üstü; tek motor kısıtları; IOCC'ye ACARS/SATCOM/telsizle bildirim.","Örnekler: (1) Tek pistli varışta pist tıkanır, go-around sonrası alternatife; yakıt FRF'ye yakınsa MINIMUM FUEL. (2) Holding'de 25 dk gecikme; 7 dk contingency + 25 dk alternate + 30 dk FRF; diversion artık mümkün değilse MINIMUM FUEL. (3) 5 saatlik uçuşta FL350→FL230'a inilir, tüketim artar; iki pistli ve çok iyi havayla alternatifsiz replan (<4 saat) yapılır."]],["s.234–241 · Kokpit Düzeni",["Kalkış ve inişte her pilot görev yerinde. Tek pilot kalırsa headset takılı ve ses açık, kumandalara erişim engelsiz, uyanıklık sürekli; gerekirse kemer işareti art arda açılıp kapatılarak veya interphone ile çağrılır. Ayrılırken kalan pilotun uyanıklığı, operasyon yoğunluğu (raporlama noktaları, ATC devri, kritik hava) ve süre dikkate alınır.","Headset+boom mic: yerde ATC klerensi veya motor start (hangisi önce), FL200 altında, inişten park yerine kadar, Commander gerekli gördüğünde. Seyirde hoparlör serbest; ses düşük tutulur.","Controlled rest: Commander organize eder; aynı anda tek pilot, kemerli; en fazla 45 dk, ardından 20 dk toparlanma (kumanda verilmez) ve brifing; Cabin Chief bilgilendirilir.","Sterile cockpit: kritik evreler, taksi, kalkış sonrası/iniş öncesi 10.000 ft AAL altı (seyir hariç), Commander'ın belirlediği diğer evreler; iletişim yalnızca emniyet/security.","Kemerler: pilot kemeri sürekli; omuz kemeri motor start öncesi bağlı, tırmanışta en erken 10.000 ft AAL'de çözülür, alçalışta en geç 10.000 ft AAL'de bağlanır, motorlar durana kadar bağlı. Kabin ekibi: kalkıştan 5.000 ft AAL'ye kadar kemerli; Commander kemer işaretini OFF-ON yaparak serbest bırakır; alçalışta en geç 5.000 ft AAL'de “Cabin crew be seated for landing” anonsundan sonra bağlanır.","Kokpite giriş: görevli mürettebat, DGCA/denetçi/IOSA/LOSA gözlemcisi, eğitim-kontrol pilotları, Chief Flight Operations Officer onaylı personel, yönetim kadrosu (Accountable Manager, Nominated Person'lar, SVP/VP'ler, Fleet Manager'lar), pozisyonlama uçuşlarında üniformalı mürettebat; Commander takdirinde üniformalı şirket pilotları."]],["s.242–252 · Incapacitation, PED, Anons, Otomasyon, Sağlık",["Pilot incapacitation: “I have control”, otomasyon, emergency ilanı; PA ile “ATTENTION, PURSER/CABIN CHIEF TO THE COCKPIT”; koltuk tamamen geri, mümkünse koltuktan çıkarılması (en az 2 kişi); en kısa sürede iniş ama acele yaklaşma yok; inişte yer değiştirilmez; iniş sonrası tıbbi yardım.","Kabin ekibi incapacitation: Commander hemen bilgilendirilir; Cabin Chief ise yerine en uygun kalifiye Cabin Chief (operating/deadhead), yoksa en uygun kalifiye kabin ekibi üyesi (nihai karar Commander).","PED: yardımcı cihazlar izinli; kritik anlarda kullanılmaz; Flight Mode, elektriğe bağlı değil, saklanmış ve 20.000 ft altında (taksi dahil) kullanılmaz; observer koltuktaki pilotlar kritik evrelerde Flight Mode'da kullanabilir; düşük görüşlü operasyonda tüm PED'ler kapalı ve saklanır.","Sigara/e-sigara tüm bölümlerde yerde ve havada yasak; rampa ve köprüde de; Commander sigaraya izin veremez, ihlal uçuş emniyeti ihlali sayılır.","Anons: biniş sonrası ve alçalış öncesi (en geç top of descent'ten önce biter); önce Türkçe sonra İngilizce; anons öncesi görev devri, headset takılı; yerde 10–15 dk ve üzeri gecikmede yolcular bilgilendirilir; film/kabin anonsu sırasında yapılmaz.","Otomasyon: A/P, F/D, A/THR maksimum pratik kullanım; iyi havada düşük trafikli alanlarda manuel beceri için manuel kalkış/varış; A/P F/D komutları uyuyorsa ve uçuş yolu kontroldeyse devreye alınır; CAT II manuel olabilir ama autoland önerilir.","Hasta/yaralı yolcu: yolcular arasından doktor/hemşire/paramedik aranır, ilk yardım, en kısa sürede uygun havaalanına iniş, IOCC ile temas ve ambulans; doktor ölümü doğrulamadıkça kişi hayatta sayılır.","First aid kit'i Cabin Chief açar, mühür/kontrol HUB Control Center'dadır. Emergency Medical Kit: Commander onayı ve ilaçların yalnızca kalifiye kişi tarafından verildiği teyidi gerekir. Emniyet kaygısı tetik kelimesi: “UNCOMFORTABLE”."]],["s.216–229 · Yaklaşma ve Yakıt Yönetimi",["NPA'larda stabilize CDFA tekniği; tüm yaklaşmalar stabilize uçulur.","PM çağrıları: atanmış irtifaya 2.000 ve 1.000 ft kala “2,000 TO GO”, “1,000 TO GO”.","TA'da görsel temas aranır, manevra yapılmaz; RA'da sapmadan sonra “TURKISH 123 TCAS RA”; ATC çelişirse “UNABLE, TCAS RA”.","Uçuşta yakıt kontrolü en fazla 60 dk arayla; varışta beklenen yakıt ≥ alternate + FRF (alternatifsizse ≥ FRF).","MINIMUM FUEL acil durum değildir; seçeneklerin tek alana indiğini bildirir."]],["s.234–239 · Kokpit Disiplini",["Kalkış ve inişte herkes görev yerinde; tek pilot kalırsa headset takılı, kumanda erişimi açık, uyanıklık korunur.","Headset: yerde ATC clearance/motor start öncesi, FL200 altında ve inişten park yerine kadar zorunlu.","Controlled rest: tek pilot, en fazla 45 dk, sonra 20 dk toparlanma; bu süre kumanda verilmez.","Sterile cockpit: kritik evreler, taksi ve 10.000 ft AAL altında (seyir hariç); iletişim yalnızca emniyet/security.","Omuz kemeri: motor start öncesi bağlanır, tırmanışta en erken 10.000 ft AAL'de çözülür, alçalışta en geç 10.000 ft AAL'de bağlanır. Kabin ekibi için 5.000 ft AAL."]],["s.242–252 · Acil Durum ve Genel",["Pilot incapacitation: “I have control”, otomasyon, emergency ilanı, kabin amiri kokpite çağrılır.","Sigara/e-sigara tüm bölümlerde yasak.","Yolcu anonsları: Türkçe sonra İngilizce; alçalış anonsu en geç top of descent'ten önce biter; anons öncesi görev devri yapılır.","First aid kit'i Cabin Chief açar; mühür/kontrol HUB Control Center'dadır.","Emniyet kaygısı tetik kelimesi: “UNCOMFORTABLE”."]]],
"8.8":[["s.254–257 · Oksijen",["10.000 ft üzeri basınçlı uçakta suplemental oksijen; kokpit ekibi kabin irtifası 10.000 ft üzerine çıkarsa sürekli kullanır (30 dk üzeri ve 13.000 ft üzeri zorunlu).","First aid oksijeni: kabin irtifası 15.000 ft üzerinde tüm yolcular; 14.000–15.000 ft arası en az %30; 10.000–14.000 ft arası 30 dk üzeri için en az %10.","25.000 ft üzeri operasyonda first aid oksijeni gerekir.","PBE: kokpitte kolay erişilebilir, her biri en az 15 dk oksijen; yangın söndürmeye izin vermeli."]]]};

const v=document.getElementById('v'),t1=document.getElementById('t1'),t2=document.getElementById('t2');let st={};
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const chOf=p=>Object.keys(C).find(k=>p>=C[k][0]&&p<=C[k][1]);
function tab(n){t1.classList.toggle('on',n==1);t2.classList.toggle('on',n==2);n==1?summary():setup()}
t1.onclick=()=>tab(1);t2.onclick=()=>tab(2);
function summary(){const pg=[...new Set(Q.map(q=>q[0]))];
v.innerHTML=`<div class="card"><b>Kapsam:</b> Şu an ${Q.length} soru, sayfalar ${pg.length?Math.min(...pg)+"–"+Math.max(...pg):""}. Diğer sayfalar bölüm bölüm ekleniyor.</div><select id="sc">${Object.keys(C).map(k=>`<option>${k} · ${C[k][2]} (s.${C[k][0]}–${C[k][1]})</option>`).join('')}</select><div id="sb"></div>`;
const f=()=>{const k=document.getElementById('sc').value.slice(0,3),l=S[k];document.getElementById('sb').innerHTML=l.length?l.map(([h,x])=>`<div class="card"><h2>${esc(h)}</h2>${typeof x=='string'?T[x]:`<ul>${x.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>`}</div>`).join(''):'<div class="card mu">Bu bölümün özeti henüz eklenmedi.</div>'};
document.getElementById('sc').onchange=f;f()}
function setup(){v.innerHTML=`<div class="card"><div class="mu">Bölüm</div><select id="f"><option value="">Tüm bölümler (${Q.length})</option>${Object.keys(C).map(k=>{const n=Q.filter(q=>chOf(q[0])==k).length;return`<option value="${k}">${k} · ${C[k][2]} (${n})</option>`}).join('')}</select><div class="mu">Sayfa</div><select id="p"></select><button class="pri" id="go" style="width:100%;margin-top:8px">Başla</button></div>`;
const f=document.getElementById('f'),p=document.getElementById('p');
const fill=()=>{const pg=[...new Set(Q.filter(q=>!f.value||chOf(q[0])==f.value).map(q=>q[0]))].sort((a,b)=>a-b);p.innerHTML='<option value="">Tüm sayfalar</option>'+pg.map(x=>`<option>${x}</option>`).join('')};f.onchange=fill;fill();
document.getElementById('go').onclick=()=>{st={qs:sh(Q.filter(q=>(!f.value||chOf(q[0])==f.value)&&(!p.value||q[0]==p.value))),i:0,s:0,w:[]};ask()}}
function ask(){const q=st.qs[st.i];if(!q)return done();st.o=sh(q[2]);st.a=false;
v.innerHTML=`<div class="mu">Soru ${st.i+1}/${st.qs.length} · Doğru ${st.s}</div><div class="bar"><i style="width:${st.i/st.qs.length*100}%"></i></div><div class="card"><span class="pg">OM-A sayfa ${q[0]} · ${chOf(q[0])}</span><br><b>${esc(q[1])}</b>${q[4]?T[q[4]]:''}<div>${st.o.map((x,k)=>`<button class="opt" data-k="${k}">${esc(x)}</button>`).join('')}</div><div id="e"></div></div>`;
v.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(b))}
function pick(b){if(st.a)return;st.a=true;const q=st.qs[st.i],ok=st.o[+b.dataset.k]===q[2][0];ok?st.s++:st.w.push(q);
v.querySelectorAll('.opt').forEach(x=>{if(st.o[+x.dataset.k]===q[2][0])x.classList.add('ok')});if(!ok)b.classList.add('no');
document.getElementById('e').innerHTML=`<div class="exp">${ok?'✅ Doğru. ':'❌ Yanlış. '}${esc(q[3])} <span class="mu">(OM-A s.${q[0]})</span></div><button class="pri" id="nx" style="width:100%;margin-top:10px">${st.i+1<st.qs.length?'Sonraki':'Sonucu gör'}</button>`;
document.getElementById('nx').onclick=()=>{st.i++;ask()}}
function done(){const n=st.qs.length,p=n?Math.round(st.s/n*100):0,pgs=[...new Set(st.w.map(q=>q[0]))].sort((a,b)=>a-b);
v.innerHTML=`<div class="card"><div class="big">${st.s}/${n} · %${p}</div>${pgs.length?`<p>Tekrar okuman gereken sayfalar: <b>${pgs.join(', ')}</b></p><button class="opt" id="rw">Yanlışlarımı tekrar çöz (${st.w.length})</button>`:''}<button class="pri opt" id="ag">Yeni quiz</button></div>`;
document.getElementById('ag').onclick=setup;const r=document.getElementById('rw');if(r)r.onclick=()=>{st={qs:sh(st.w),i:0,s:0,w:[]};ask()}}
summary();
</script></body></html>
